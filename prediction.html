<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landslide Guardian - Early Warning System</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --danger-color: #ef4444;
      --success-color: #22c55e;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background-color: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      max-width: 500px;
      width: 100%;
    }

    h1 {
      text-align: center;
      color: var(--accent-color);
      margin-bottom: 24px;
      font-size: 1.8rem;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    input[type="number"], select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      box-sizing: border-box;
      font-size: 1rem;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--accent-color);
      border: none;
      border-radius: 6px;
      color: #0f172a;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s ease-in-out;
      margin-top: 10px;
    }

    button:hover {
      background-color: #0284c7;
      color: #fff;
    }

    .result-card {
      margin-top: 24px;
      padding: 15px;
      border-radius: 8px;
      background-color: #0f172a;
      display: none;
      text-align: center;
    }

    .result-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .status-alert {
      font-size: 0.85rem;
      margin-top: 8px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Landslide Guardian</h1>
    
    <form id="predictionForm">
      <div class="form-group">
        <label for="rainfall">Rainfall Intensity (mm/hr):</label>
        <input type="number" id="rainfall" placeholder="e.g., 85" required min="0" max="300">
      </div>

      <div class="form-group">
        <label for="slope">Slope Angle (Degrees):</label>
        <input type="number" id="slope" placeholder="e.g., 40" required min="0" max="90">
      </div>

      <div class="form-group">
        <label for="moisture">Soil Moisture Level (%):</label>
        <input type="number" id="moisture" placeholder="e.g., 75" required min="0" max="100">
      </div>

      <button type="submit">Predict Risk Level</button>
    </form>

    <div id="resultCard" class="result-card">
      <div id="resultTitle" class="result-title"></div>
      <div id="riskScoreDisplay"></div>
      <div id="statusAlert" class="status-alert"></div>
    </div>
  </div>

  <script>
    const formspreeEndpoint = "https://formspree.io/f/xdeobavj";

    document.getElementById('predictionForm').addEventListener('submit', async function(event) {
      event.preventDefault();

      const rainfall = parseFloat(document.getElementById('rainfall').value);
      const slope = parseFloat(document.getElementById('slope').value);
      const moisture = parseFloat(document.getElementById('moisture').value);

      // Simple weighted prediction formula for demonstration
      let riskScore = Math.min(100, Math.round((rainfall * 0.4) + (slope * 0.8) + (moisture * 0.3)));

      const resultCard = document.getElementById('resultCard');
      const resultTitle = document.getElementById('resultTitle');
      const riskScoreDisplay = document.getElementById('riskScoreDisplay');
      const statusAlert = document.getElementById('statusAlert');

      resultCard.style.display = "block";
      riskScoreDisplay.innerText = `Calculated Risk Index: ${riskScore} / 100`;

      if (riskScore >= 60) {
        resultTitle.innerText = "⚠️ HIGH LANDSLIDE RISK DETECTED";
        resultTitle.style.color = "var(--danger-color)";
        statusAlert.innerText = "Dispatching automated SMS emergency alert...";

        // Trigger SMS alert via Formspree -> Twilio integration
        await sendSMSAlert(riskScore, rainfall, slope, moisture);
      } else {
        resultTitle.innerText = "✅ LOW / MODERATE RISK";
        resultTitle.style.color = "var(--success-color)";
        statusAlert.innerText = "Conditions are currently within safe operational limits.";
      }
    });

    async function sendSMSAlert(riskScore, rainfall, slope, moisture) {
      const statusAlert = document.getElementById('statusAlert');

      try {
        const response = await fetch(formspreeEndpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({
            alert: "⚠️ HIGH RISK LANDSLIDE WARNING",
            score: riskScore,
            rainfall: `${rainfall} mm/hr`,
            slope: `${slope}°`,
            moisture: `${moisture}%`,
            message: `Landslide Guardian Alert: High risk detected (${riskScore}/100). Take immediate safety precautions!`
          })
        });

        if (response.ok) {
          statusAlert.innerText = "📲 Automated SMS Alert dispatched successfully!";
          statusAlert.style.color = "var(--success-color)";
        } else {
          statusAlert.innerText = "⚠️ Failed to dispatch SMS alert.";
          statusAlert.style.color = "var(--danger-color)";                      
        }
      } catch (error) {
        console.error("SMS Dispatch Error:", error);
        statusAlert.innerText = "⚠️ Network error sending alert.";
        statusAlert.style.color = "var(--danger-color)";
      }
    }
  </script>
</body>
</html>
