<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Risk Prediction | Landslide Guardian</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #f4f7f6; color: #1f2937; line-height: 1.6; }
        header { background: #12372a; color: white; padding: 20px; text-align: center; }
        nav { margin-top: 15px; }
        nav a { color: white; margin: 0 10px; text-decoration: none; font-weight: bold; padding: 6px 12px; border-radius: 4px; border: 1px solid white; }
        nav a:hover { background: white; color: #12372a; }
        .container { max-width: 600px; margin: 30px auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 12px; background: #4caf50; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #45a049; }
        #result { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; text-align: left; }
        .low { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .moderate { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .high { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .action-box { margin-top: 10px; padding-top: 10px; border-top: 1px dashed rgba(0,0,0,0.2); font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <h1>Landslide Guardian</h1>
        <p>AI-Based Landslide Early Warning System</p>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="prediction.html">AI Prediction</a>
            <a href="map.html">Hazard Map</a>
        </nav>
    </header>

    <div class="container">
        <h2>Input Environmental Data</h2>
        <form id="riskForm" style="margin-top: 15px;">
            <div class="form-group">
                <label>Rainfall (mm):</label>
                <input type="number" id="rainfall" placeholder="e.g., 72" required>
            </div>
            <div class="form-group">
                <label>Soil Moisture (%):</label>
                <input type="number" id="moisture" placeholder="e.g., 68" required>
            </div>
            <div class="form-group">
                <label>Temperature (°C):</label>
                <input type="number" id="temp" placeholder="e.g., 24" required>
            </div>
            <div class="form-group">
                <label>Slope Angle (°):</label>
                <input type="number" id="slope" placeholder="e.g., 31" required>
            </div>
            <button type="button" onclick="calculateRisk()">Calculate Risk Score</button>
        </form>

        <div id="result"></div>
    </div>

    <script>
        function calculateRisk() {
            const rain = parseFloat(document.getElementById('rainfall').value) || 0;
            const moisture = parseFloat(document.getElementById('moisture').value) || 0;
            const temp = parseFloat(document.getElementById('temp').value) || 0;
            const slope = parseFloat(document.getElementById('slope').value) || 0;

            // Weighted Risk Calculation
            let score = Math.min(100, Math.round((rain * 0.4) + (moisture * 0.3) + (slope * 0.2) + (temp * 0.1)));
            
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';

            if (score < 40) {
                resultDiv.className = 'low';
                resultDiv.innerHTML = `<strong>Low Risk Score: ${score}/100</strong>
                    <div class="action-box"><strong>Recommended Protocol:</strong> Normal monitoring. Conditions are stable.</div>`;
            } else if (score < 70) {
                resultDiv.className = 'moderate';
                resultDiv.innerHTML = `<strong>Moderate Risk Warning! Score: ${score}/100</strong>
                    <div class="action-box"><strong>Recommended Protocol:</strong> Issue advisory to local authorities. Monitor soil saturation closely.</div>`;
            } else {
                resultDiv.className = 'high';
                resultDiv.innerHTML = `<strong>CRITICAL HIGH RISK ALERT! Score: ${score}/100</strong>
                    <div class="action-box"><strong>Recommended Protocol:</strong> Trigger automated SMS alert to vulnerable zones. Initiate immediate slope evacuation!</div>`;
            }
        }
    </script>
</body>
</html>
