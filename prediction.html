<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Risk Prediction | Landslide Guardian</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #f4f7f6; color: #222; padding-bottom: 40px; }
    header { background: #12372a; color: white; padding: 20px 7.5%; text-align: center; }
    
    .container { max-width: 600px; margin: 30px auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { margin-bottom: 20px; color: #12372a; text-align: center; }
    
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
    
    button { width: 100%; background: #4caf50; color: white; border: none; padding: 12px; font-size: 18px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    button:hover { background: #45a049; }
    
    .result-box { margin-top: 20px; padding: 15px; border-radius: 5px; display: none; text-align: center; font-size: 18px; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <h1>Landslide Guardian</h1>
    <p>AI-Based Landslide Early Warning System</p>
  </header>

  <div class="container">
    <h2>Input Environmental Data</h2>
    
    <form id="predictionForm">
      <div class="form-group">
        <label for="rainfall">Rainfall (mm):</label>
        <input type="number" id="rainfall" placeholder="e.g., 72" required>
      </div>

      <div class="form-group">
        <label for="moisture">Soil Moisture (%):</label>
        <input type="number" id="moisture" placeholder="e.g., 68" required>
      </div>

      <div class="form-group">
        <label for="temperature">Temperature (°C):</label>
        <input type="number" id="temperature" placeholder="e.g., 24" required>
      </div>

      <div class="form-group">
        <label for="slope">Slope Angle (°):</label>
        <input type="number" id="slope" placeholder="e.g., 31" required>
      </div>

      <button type="submit">Calculate Risk Score</button>
    </form>

    <div id="result" class="result-box"></div>
  </div>

  <script>
    document.getElementById('predictionForm').addEventListener('submit', function(e) {
      e.preventDefault();

      // Read values from form fields
      const rainfall = parseFloat(document.getElementById('rainfall').value);
      const moisture = parseFloat(document.getElementById('moisture').value);
      const slope = parseFloat(document.getElementById('slope').value);

      // Simple prediction logic threshold
      let riskScore = (rainfall * 0.4) + (moisture * 0.4) + (slope * 0.2);
      riskScore = Math.min(Math.round(riskScore), 100);

      const resultDiv = document.getElementById('result');
      resultDiv.style.display = 'block';

      if (riskScore >= 70) {
        resultDiv.style.background = '#ffebee';
        resultDiv.style.color = '#c62828';
        resultDiv.innerText = `High Risk Warning! Risk Score: ${riskScore}/100`;
      } else if (riskScore >= 40) {
        resultDiv.style.background = '#fffde7';
        resultDiv.style.color = '#f57f17';
        resultDiv.innerText = `Moderate Risk. Risk Score: ${riskScore}/100`;
      } else {
        resultDiv.style.background = '#e8f5e9';
        resultDiv.style.color = '#2e7d32';
        resultDiv.innerText = `Low Risk. Risk Score: ${riskScore}/100`;
      }
    });
  </script>

</body>
</html>
